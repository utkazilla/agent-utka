name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install test dependencies
        shell: pwsh
        run: |
          $log = python -m pip --isolated --disable-pip-version-check install --only-binary=:all: -r requirements.txt 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Python dependencies::$($log | Select-Object -Last 8 | Join-String -Separator '%0A')"
            exit $status
          }
      - name: Test source
        shell: pwsh
        run: |
          $log = python -X utf8 -m unittest discover -s tests 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Python tests::$($log | Select-Object -Last 35 | Join-String -Separator '%0A')"
            exit $status
          }
      - name: Build and smoke test the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem -Path (Join-Path $visualStudio 'VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT') -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$crt -or !(Test-Path -LiteralPath $iscc)) { throw 'Missing Inno Setup or the x64 Visual C++ runtime.' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $log = python -X utf8 scripts/build_windows_installer.py --version $version --output dist --vc-redist $crt --iscc $iscc 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Windows installer::$($log | Select-Object -Last 22 | Join-String -Separator '%0A')"
            exit $status
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag'
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check ./*.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Agent Utka $GITHUB_REF_NAME" --notes-file - ./*.exe ./*.sha256 <<'NOTES'
          Download and double-click the **Agent-Utka-Setup** Windows x64 executable below on Windows 10 or 11. Python is included; no terminal or separate Python installation is required.

          ### What's new
          - **Start with a file.** Click **Import a file…** and choose a Markdown or text document. On a fresh install, Agent Utka suggests a base name from the file. Confirm it and the app creates, selects, and indexes the base.
          - **Create a summary from your project.** If you need a file first, click **Copy prompt** and paste it into your project conversation in Codex or Claude Code. Import the Markdown it generates.
          - **Add to an existing base or create another.** When bases exist, choose the destination at import. Use **Edit document name…** to customize how a document appears in sources.

          ### Getting started
          Open **Agent Utka** from Start. **Download and start** prepares Qwen speech recognition and portable Ollama with the default answer model. Allow about 6 GB of downloads and 12 GB of free disk space during initial setup. Models are downloaded to your PC and are not bundled in this release.

          Try a file of your own or the [fictional Orbit example](https://github.com/utkazilla/agent-utka/blob/main/docs/examples/orbit-knowledge.md). Wait for **Ready**, then type a question or select transcript text and press **Ask**. Open **Sources** to inspect the evidence.

          Speech and answer providers remain independently configurable. Qwen3-ASR 0.6B and 1.7B support CPU and NVIDIA GPU; Faster Whisper CUDA dependencies are downloaded on demand. Loaded models can be unloaded through Settings.

          The Windows build tests a fresh installation, including the first import into an empty profile with fictional data. The installer ships without personal projects or preconfigured knowledge bases. A SHA-256 checksum is attached. The installer is unsigned and Windows may show a SmartScreen warning.

          [Tutorial and examples](https://github.com/utkazilla/agent-utka#use-your-own-project)
          NOTES
