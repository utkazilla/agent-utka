name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install test dependencies
        shell: pwsh
        run: |
          $log = python -m pip --isolated --disable-pip-version-check install --only-binary=:all: -r requirements.txt 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Python dependencies::$($log | Select-Object -Last 8 | Join-String -Separator '%0A')"
            exit $status
          }
      - name: Test source
        shell: pwsh
        run: |
          $log = python -X utf8 -m unittest discover -s tests 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Python tests::$($log | Select-Object -Last 35 | Join-String -Separator '%0A')"
            exit $status
          }
      - name: Build and smoke test the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem -Path (Join-Path $visualStudio 'VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT') -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (!$crt -or !(Test-Path -LiteralPath $iscc)) { throw 'Missing Inno Setup or the x64 Visual C++ runtime.' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $log = python -X utf8 scripts/build_windows_installer.py --version $version --output dist --vc-redist $crt --iscc $iscc 2>&1
          $status = $LASTEXITCODE
          $log
          if ($status) {
            "::error title=Windows installer::$($log | Select-Object -Last 22 | Join-String -Separator '%0A')"
            exit $status
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag'
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check ./*.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Agent Utka $GITHUB_REF_NAME" --notes-file - ./*.exe ./*.sha256 <<'NOTES'
          Download and double-click the **Agent-Utka-Setup** Windows x64 executable below on Windows 10 or 11. Python is included; no terminal or separate Python installation is required.

          ### What's new
          - **Knowledge actions are always available.** New base creates a persistent empty base directly from the main window. Copy prompt, Import and Open base sit together above the transcript. An empty knowledge browser offers an import action.
          - **Name each summary during import.** Document names and knowledge-base names are separate. An explicit New base button creates a destination; Sources and the knowledge browser show the chosen document name. Reimporting the same original file preserves or updates that name without duplicates.
          - **Legacy base labels fixed.** Old imported bases use their knowledge title instead of the name of their storage folder.
          - **Copy prompt → Import** on the main screen. Pick an existing named knowledge base or create one without choosing a storage folder.
          - **Multiple documents per base.** Reimporting the same original file into the same base updates its copy. Different files with identical names stay separate.
          - **All bases search.** Search one base or all imported bases. Citations and the knowledge browser retain the originating base.
          - **Type your own question.** Write or paste a question on the main screen and press its Ask button or Ctrl+Enter in the field. Works without speech and uses the selected base or All bases, with citations and answer history.
          - **Complete project-memory prompts in English, Russian and Spanish.** The prompts cover accessible conversation history, code structure, MR/PR changes and review discussions, linked documentation, source provenance, historical decisions and coverage gaps. They do not impose output-length or full-glossary entry quotas.
          - **Large knowledge documents.** Removed the 180 KB import cap and the 200-entry glossary cap. Long paragraphs retain their full text and original citation lines.
          - **Model/settings improvements.** Saved model changes apply in the current session, selection dialogs close after saving, and dependency downloads show progress.

          ### Getting started
          Open **Agent Utka** from Start. **Download and start** prepares Qwen speech recognition and portable Ollama with the default answer model. Allow about 6 GB of downloads and 12 GB of free disk space during initial setup. Models are downloaded to your PC and are not bundled in this release.

          Copy the project-memory prompt into your project conversation, review the generated Markdown, then import it into the desired base. Select transcript text and press **Ask** or **Ctrl+Enter**. Open **Sources** to inspect the evidence, or **Open base** on the main screen to test retrieval.

          Speech and answer providers remain independently configurable. Qwen3-ASR 0.6B and 1.7B support CPU and NVIDIA GPU; Faster Whisper CUDA dependencies are downloaded on demand. Loaded models can be unloaded through Settings.

          The knowledge prompt can only extract accessible evidence. Unavailable messages, documents and review threads are recorded as gaps, not invented answers.

          The Windows build runs source tests and checks a fresh installation with the bundled interpreter. A SHA-256 checksum is attached. The installer is not code-signed yet, so Windows may show a SmartScreen warning.

          [Tutorial and examples](https://github.com/utkazilla/agent-utka#use-your-own-project)
          NOTES
